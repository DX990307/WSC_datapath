<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="620" viewBox="0 0 1320 620">
  <defs>
    <style>
      .title { font: 700 26px Arial, sans-serif; fill: #111827; }
      .label { font: 700 17px Arial, sans-serif; fill: #111827; }
      .small { font: 14px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #4b5563; }
      .box { stroke: #111827; stroke-width: 1.5; rx: 8; ry: 8; }
      .base { fill: #f9fafb; }
      .m1 { fill: #dbeafe; }
      .m2 { fill: #dcfce7; }
      .m3 { fill: #fef3c7; }
      .path { stroke: #1f2937; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrowGray); }
      .note { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.1; rx: 8; ry: 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1320" height="620" fill="#ffffff"/>
  <text x="40" y="45" class="title">M1/M2/M3 Datapath Overview</text>
  <text x="40" y="72" class="small">The current design optimizes local L2/DRAM batching, remote RDMA packet batching, and reuse of remote data fills.</text>

  <rect x="45" y="135" width="130" height="68" class="box base"/>
  <text x="82" y="164" class="label">CU/ROB</text>
  <text x="64" y="188" class="small">data request</text>

  <rect x="240" y="125" width="170" height="88" class="box base"/>
  <text x="287" y="158" class="label">L1V Cache</text>
  <text x="259" y="183" class="small">directory + MSHR</text>
  <text x="260" y="202" class="tiny">remote-data lookup when enabled</text>

  <rect x="245" y="245" width="180" height="92" class="box m1"/>
  <text x="276" y="276" class="label">M1-L1V</text>
  <text x="264" y="300" class="small">no demand wait</text>
  <text x="264" y="320" class="small">128B AU predictor</text>

  <rect x="500" y="120" width="190" height="96" class="box m1"/>
  <text x="541" y="153" class="label">M1-L2</text>
  <text x="521" y="178" class="small">same-set local</text>
  <text x="520" y="198" class="small">directory batching</text>

  <rect x="760" y="120" width="190" height="96" class="box m1"/>
  <text x="799" y="153" class="label">M1-DRAM</text>
  <text x="786" y="178" class="small">same 128B AU</text>
  <text x="783" y="198" class="small">multi-line read</text>

  <rect x="1030" y="120" width="170" height="96" class="box base"/>
  <text x="1080" y="153" class="label">DRAM</text>
  <text x="1062" y="178" class="small">timing path</text>
  <text x="1065" y="198" class="small">128B access unit</text>

  <rect x="500" y="360" width="210" height="100" class="box m2"/>
  <text x="552" y="393" class="label">M2 RDMA</text>
  <text x="526" y="418" class="small">requester-side bitmap</text>
  <text x="533" y="438" class="small">4KB page grouping</text>

  <rect x="795" y="360" width="210" height="100" class="box base"/>
  <text x="848" y="393" class="label">Network</text>
  <text x="830" y="418" class="small">switches, channels,</text>
  <text x="851" y="438" class="small">endpoints</text>

  <rect x="1080" y="350" width="190" height="116" class="box base"/>
  <text x="1123" y="383" class="label">Owner RDMA</text>
  <text x="1101" y="408" class="small">expands bitmap reqs</text>
  <text x="1108" y="428" class="small">to remote L2/DRAM</text>
  <text x="1106" y="448" class="tiny">optional M3 fair queue</text>

  <rect x="500" y="500" width="210" height="82" class="box m3"/>
  <text x="535" y="532" class="label">M3 Remote Cache</text>
  <text x="529" y="557" class="small">L1V remote-only area</text>

  <path class="path" d="M175 169 L240 169"/>
  <path class="path" d="M410 169 L500 169"/>
  <path class="path" d="M690 169 L760 169"/>
  <path class="path" d="M950 169 L1030 169"/>
  <path class="path" d="M325 213 L325 245"/>
  <path class="dash" d="M425 291 C505 288 515 229 532 216"/>

  <path class="path" d="M410 177 C465 245 480 330 500 405"/>
  <path class="path" d="M710 410 L795 410"/>
  <path class="path" d="M1005 410 L1080 410"/>
  <path class="path" d="M1175 350 C1170 290 1188 255 1200 216"/>

  <path class="dash" d="M1080 452 C930 555 785 548 710 541"/>
  <path class="dash" d="M500 541 C420 520 365 470 338 337"/>

  <rect x="45" y="390" width="375" height="132" class="note"/>
  <text x="66" y="420" class="label">Design intent</text>
  <text x="66" y="448" class="small">M1 exploits local spatial grouping at L1V, L2, and DRAM.</text>
  <text x="66" y="472" class="small">M2 reduces remote packet count using page-level bitmaps.</text>
  <text x="66" y="496" class="small">M3 stores remote fills so prefetched lines can be reused locally.</text>
</svg>
